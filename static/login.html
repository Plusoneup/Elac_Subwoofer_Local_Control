<style>
:root{--bg:#0d1014;--panel:#151a20;--line:#29313a;--text:#f2f4f6;--muted:#8d99a6;--accent:#FF4D06}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f6;--panel:#fff;--line:#cbd2da;--text:#17202a;--muted:#566474}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.logo{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;margin-bottom:14px;overflow:hidden}.logo img{width:34px;height:34px;object-fit:contain;display:block}
h1{font-size:19px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:14px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#11150a;font:inherit;font-weight:700;cursor:pointer}
.err{color:#e05252;margin:-4px 0 14px}
</style>
